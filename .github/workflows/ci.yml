name: CI

on:
  push:
    branches: [digital-twin-platform, main]
  pull_request:

jobs:
  tests:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (WeasyPrint renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # torch >= 2.4 CPU wheel on every run: the default PyPI wheel adds
          # ~2 GB of CUDA libraries. The pytorch CPU index is listed first so
          # pip prefers it for torch and falls back to PyPI for everything
          # else (numpy, sklearn, fastapi, ...).
          python -m pip install -r requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
      - name: Run test suite
        run: python -m pytest -q

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py